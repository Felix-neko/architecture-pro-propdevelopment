apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sales-test-secrets-reader
  # Роль для полного чтения секретов в тестовых пространствах
  # Предназначена для sales-services-test1, sales-services-test2, sales-services-test3
rules:
# Полный доступ к чтению секретов в тестовых средах
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
# Чтение событий для отладки проблем с секретами
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
# Чтение подов для проверки использования секретов
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
