# ===== APP-DEPLOYER ROLEBINDINGS FOR SALES-DEVELOPERS IN TEST ENVIRONMENTS =====
# RoleBinding для развертывания приложений группой sales-developers только в тестовых пространствах
# В тестовых средах разработчики могут делать что угодно - их не жалко, это песочница для экспериментов

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sales-developers-app-deployer-binding
  namespace: sales-services-test1
  # Привязка для развертывания приложений группой sales-developers в test1
  # Тестовая среда - можно ломать и экспериментировать
subjects:
- kind: Group
  name: sales-developers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sales-developers-app-deployer-binding
  namespace: sales-services-test2
  # Привязка для развертывания приложений группой sales-developers в test2
  # Тестовая среда - разработчики могут свободно создавать и удалять ресурсы
subjects:
- kind: Group
  name: sales-developers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sales-developers-app-deployer-binding
  namespace: sales-services-test3
  # Привязка для развертывания приложений группой sales-developers в test3
  # Тестовая среда - полная свобода для разработчиков, экспериментируйте!
subjects:
- kind: Group
  name: sales-developers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-deployer
  apiGroup: rbac.authorization.k8s.io

