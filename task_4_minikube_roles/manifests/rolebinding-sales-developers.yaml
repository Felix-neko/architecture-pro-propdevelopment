# RoleBinding для группы sales-developers
# Привязывает роль app-viewer для просмотра ресурсов в sales пространствах
# Предназначена для разработчиков с правами только на чтение

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-viewer-binding
  namespace: sales-services-prod
  # Привязка для просмотра ресурсов в production среде
subjects:
- kind: Group
  name: sales-developers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-viewer-binding
  namespace: sales-services-dev
  # Привязка для просмотра ресурсов в development среде
subjects:
- kind: Group
  name: sales-developers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-viewer-binding
  namespace: sales-services-test1
  # Привязка для просмотра ресурсов в тестовой среде test1
subjects:
- kind: Group
  name: sales-developers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-viewer-binding
  namespace: sales-services-test2
  # Привязка для просмотра ресурсов в тестовой среде test2
subjects:
- kind: Group
  name: sales-developers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-viewer-binding
  namespace: sales-services-test3
  # Привязка для просмотра ресурсов в тестовой среде test3
subjects:
- kind: Group
  name: sales-developers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-viewer
  apiGroup: rbac.authorization.k8s.io

