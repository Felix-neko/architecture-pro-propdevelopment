apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-viewer
rules:
# Просмотр всех основных ресурсов во всех namespace
- apiGroups: [""]
  resources: 
    - pods
    - services
    - endpoints
    - persistentvolumeclaims
    - configmaps
    - events
    - namespaces
  verbs: ["get", "list", "watch"]
# Просмотр логов подов
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
# Просмотр деплойментов и других workload ресурсов
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
  verbs: ["get", "list", "watch"]
# Просмотр ingress и network policies
- apiGroups: ["networking.k8s.io"]
  resources:
    - ingresses
    - networkpolicies
  verbs: ["get", "list", "watch"]
# Просмотр RBAC ресурсов для аудита безопасности
- apiGroups: ["rbac.authorization.k8s.io"]
  resources:
    - roles
    - rolebindings
    - clusterroles
    - clusterrolebindings
  verbs: ["get", "list", "watch"]
# НЕ включаем secrets - специально исключено для безопасности
