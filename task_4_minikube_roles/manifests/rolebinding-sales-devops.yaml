# Объединенные RoleBindings для группы sales-devops
# Включает привязки для ролей: app-deployer, config-editor, test-secrets-reader, ingress-editor
# Применяется во всех sales пространствах с соответствующими ролями

# ===== APP-DEPLOYER ROLEBINDINGS =====
# RoleBinding для развертывания приложений во всех sales пространствах

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-deployer-binding
  namespace: sales-services-prod
  # Привязка в production среде - требует особой осторожности
subjects:
- kind: Group
  name: sales-devops
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-deployer-binding
  namespace: sales-services-dev
  # Привязка в development среде для разработки и тестирования
subjects:
- kind: Group
  name: sales-devops
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-deployer-binding
  namespace: sales-services-test1
  # Привязка в тестовой среде test1
subjects:
- kind: Group
  name: sales-devops
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-deployer-binding
  namespace: sales-services-test2
  # Привязка в тестовой среде test2
subjects:
- kind: Group
  name: sales-devops
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-deployer-binding
  namespace: sales-services-test3
  # Привязка в тестовой среде test3
subjects:
- kind: Group
  name: sales-devops
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-deployer
  apiGroup: rbac.authorization.k8s.io

