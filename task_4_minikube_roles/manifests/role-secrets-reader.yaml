apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-reader
  # Роль для полного чтения секретов во всех пространствах sales-services-*
  # Предназначена для lead devops с расширенными правами доступа
rules:
# Полный доступ к чтению секретов во всех sales пространствах
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
# Чтение событий для отладки проблем с секретами
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
# Чтение подов для проверки использования секретов
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Чтение ConfigMaps для полного понимания конфигурации
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
