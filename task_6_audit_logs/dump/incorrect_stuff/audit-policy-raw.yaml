# Эту политику аудита я честно скопипастил из материалов курса, и с нею moй minikube не запускался.

apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: RequestResponse
    verbs: \["create", "delete", "update", "patch", "get", "list"\]
    resources:
      - group: ""
        resources: \["pods", "secrets", "configmaps", "serviceaccounts", "roles", "rolebindings"\]
  - level: Metadata
    resources:
      - group: "\*"  # Тут должно быть "", а не "*"
        resources: \["\*"\]


# И да, \-символы, по-моему, тоже тут не нужны.

