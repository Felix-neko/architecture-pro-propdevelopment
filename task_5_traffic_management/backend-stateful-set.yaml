# Backend StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backend
  labels:
    app: backend
    role: backend
spec:
  serviceName: backend-headless
  replicas: 1
  selector:
    matchLabels:
      app: backend
      role: backend
  template:
    metadata:
      labels:
        app: backend
        role: backend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d
        - name: html
          mountPath: /usr/share/nginx/html
      initContainers:
      - name: setup
        image: busybox
        command: ['sh', '-c']
        args:
        - |
          echo 'hello backend' > /usr/share/nginx/html/index.html
          cat > /etc/nginx/conf.d/default.conf << 'EOF'
          server {
              listen 80;
              server_name _;
              location / {
                  root /usr/share/nginx/html;
                  index index.html;
              }
          }
          EOF
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: config
        emptyDir: {}
      - name: html
        emptyDir: {}

---
# Admin Backend StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
