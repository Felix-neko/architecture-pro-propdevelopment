          mountPath: /usr/share/nginx/html
      initContainers:
      - name: setup
        image: busybox
        command: ['sh', '-c']
        args:
        - |
          echo 'hello admin backend' > /usr/share/nginx/html/index.html
          cat > /etc/nginx/conf.d/default.conf << 'EOF'
          server {
              listen 80;
              server_name _;
              location / {
