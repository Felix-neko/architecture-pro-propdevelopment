---
# Headless Service для backend
apiVersion: v1
kind: Service
metadata:
  name: backend-headless
  labels:
    app: backend
    role: backend
spec:
  clusterIP: None  # делает сервис headless
  selector:
    app: backend
    role: backend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP

---
# Headless Service для admin-backend
apiVersion: v1
kind: Service
metadata:
  name: admin-backend-headless
  labels:
    app: admin-backend
    role: admin-backend
spec:
  clusterIP: None  # делает сервис headless
  selector:
    app: admin-backend
    role: admin-backend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP